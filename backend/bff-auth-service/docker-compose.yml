services:
  postgres:
    image: postgres:16
    container_name: eventpass-postgres
    environment:
      POSTGRES_DB: eventpass_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - eventpass_pg_data:/var/lib/postgresql/data

volumes:
  eventpass_pg_data: