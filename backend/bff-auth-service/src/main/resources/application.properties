server.port=8081

spring.application.name=bff-auth-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eventpass_auth}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

jwt.secret=${JWT_SECRET:eventpass-super-secret-key-para-el-ramo-jvy0101-cambiar-en-produccion}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

logging.level.com.eventpass.bffauth=DEBUG