quarkus:
  application:
    name: tickets-worker
  http:
    # El worker no expone API HTTP; solo health/metrics en el puerto de management.
    host-enabled: false
  management:
    enabled: true
    port: ${WORKER_MANAGEMENT_PORT:9000}
  mongodb:
    connection-string: ${MONGODB_URI:mongodb://localhost:27017/eventpass_tickets}
    database: ${MONGODB_DATABASE:eventpass_tickets}
  jackson:
    serialization-inclusion: NON_NULL
  shutdown:
    timeout: 30s

# Conexión RabbitMQ compartida por los canales de entrada y salida.
rabbitmq-host: ${RABBITMQ_HOST:localhost}
rabbitmq-port: ${RABBITMQ_PORT:5672}
rabbitmq-username: ${RABBITMQ_USERNAME:guest}
rabbitmq-password: ${RABBITMQ_PASSWORD:guest}

mp:
  messaging:
    incoming:
      ordenes-creada:
        connector: smallrye-rabbitmq
        exchange:
          name: eventpass
          type: topic
          durable: true
        queue:
          name: q.tickets.ordenes-creadas
          durable: true
        routing-keys: orden.creada
        auto-acknowledgement: false
    outgoing:
      tickets-emitidos:
        connector: smallrye-rabbitmq
        exchange:
          name: eventpass
          type: topic
          durable: true
        # La routing key viaja en los metadatos del mensaje (OutgoingRabbitMQMetadata).
