server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ordenes-service
              uri: ${ORDENES_SERVICE_URL}
              predicates:
                - Path=/api/v1/ordenes/**

            - id: bff-auth-service
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/api/auth/**

            - id: eventos-service
              uri: ${EVENTOS_SERVICE_URL}
              predicates:
                - Path=/api/eventos/**
