quarkus:
  application:
    name: tickets-service
  http:
    port: ${SERVER_PORT:8080}
  mongodb:
    connection-string: ${MONGODB_URI:mongodb://localhost:27017/eventpass_tickets}
    database: ${MONGODB_DATABASE:eventpass_tickets}
  jackson:
    serialization-inclusion: NON_NULL
  shutdown:
    timeout: 10s
  index-dependency:
    roony-error-quarkus:
      group-id: io.github.roony11-1
      artifact-id: roony-error-quarkus
