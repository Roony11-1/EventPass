services:
  postgres:
    image: postgres:16
    container_name: eventpass-postgres-eventos
    environment:
      POSTGRES_DB: eventpass_eventos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - eventpass_eventos_pg_data:/var/lib/postgresql/data

volumes:
  eventpass_eventos_pg_data: